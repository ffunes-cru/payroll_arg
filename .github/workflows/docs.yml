# Publica en GitHub Pages el sitio de docs/ (MkDocs) y, en /api/, la documentación del código (Doxygen)
# de payroll_arg y payroll_arg_attendance. Corre en cada push a main (el código también es documentación);
# en los PR sólo construye y falla si hay enlaces o anclas rotos.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: payroll_arg
      # Doxygen documenta también el módulo de asistencias (Doxyfile: INPUT ../payroll_arg_attendance)
      - uses: actions/checkout@v4
        with:
          repository: ffunes-cru/payroll_arg_attendance
          path: payroll_arg_attendance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r payroll_arg/requirements-docs.txt
      - run: sudo apt-get update -q && sudo apt-get install -y -q doxygen
      - name: Sitio (MkDocs)
        working-directory: payroll_arg
        run: mkdocs build --strict
      - name: Código (Doxygen)
        working-directory: payroll_arg
        run: |
          doxygen docs/Doxyfile
          cp -r docs/api/html site/api
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: payroll_arg/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Publica en GitHub Pages el sitio de docs/ (MkDocs) y, en /api/, la documentación del código (Doxygen)
# de payroll_arg y payroll_arg_attendance. Corre en cada push a main (el código también es documentación);
# en los PR sólo construye y falla si hay enlaces o anclas rotos.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: payroll_arg
      # Doxygen documenta también el módulo de asistencias (Doxyfile: INPUT ../payroll_arg_attendance)
      - uses: actions/checkout@v4
        with:
          repository: ffunes-cru/payroll_arg_attendance
          path: payroll_arg_attendance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r payroll_arg/requirements-docs.txt
      # Doxygen >= 1.15 dibuja los diagramas Mermaid; el de Ubuntu (1.9.8) los deja como texto.
      # Versión fija, verificada con su sha256.
      - name: Instalar Doxygen 1.18.0
        run: |
          curl -sSL -o /tmp/doxygen.tgz https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz
          echo "14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90  /tmp/doxygen.tgz" | sha256sum -c -
          tar xzf /tmp/doxygen.tgz -C /tmp
          echo /tmp/doxygen-1.18.0/bin >> "$GITHUB_PATH"
      - name: Sitio (MkDocs)
        working-directory: payroll_arg
        run: mkdocs build --strict
      - name: Código (Doxygen)
        working-directory: payroll_arg
        run: |
          doxygen --version
          doxygen docs/Doxyfile
          cp -r docs/api/html site/api
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: payroll_arg/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
